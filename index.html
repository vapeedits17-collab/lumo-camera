<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Lumo Camera</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--fg:#fff;--mut:#8a8a8a;--line:#262626;--card:#111;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0}
html,body{height:100%;background:var(--bg);color:var(--fg);font-family:'Instrument Sans',system-ui,sans-serif;overflow:hidden;user-select:none}
body{display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.top{display:flex;justify-content:space-between;align-items:center;padding:10px 18px;height:54px}
.brand{font-weight:700;font-size:20px;letter-spacing:-.02em}
.ib{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;transition:transform .2s,background .2s}
.ib:active{transform:scale(.88);background:#1c1c1c}
.ib svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.stage{flex:1;min-height:0;display:grid;place-items:center;padding:0 14px}
.view{position:relative;max-width:100%;max-height:100%;height:100%;aspect-ratio:3/4;border-radius:26px;overflow:hidden;background:#0b0b0b;border:1px solid var(--line);transition:aspect-ratio .45s cubic-bezier(.2,.8,.2,1)}
video,#ov,#demo{position:absolute;inset:0;width:100%;height:100%}
video,#demo{object-fit:cover;transition:opacity .35s,filter .35s}
video.mir{transform:scaleX(-1)}
#ov{pointer-events:none}
.grid{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .3s;background:linear-gradient(#fff3,#fff3) 33.33% 0/1px 100% no-repeat,linear-gradient(#fff3,#fff3) 66.66% 0/1px 100% no-repeat,linear-gradient(#fff3,#fff3) 0 33.33%/100% 1px no-repeat,linear-gradient(#fff3,#fff3) 0 66.66%/100% 1px no-repeat}
.grid.on{opacity:1}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.flash.go{animation:fl .35s ease-out}
@keyframes fl{0%{opacity:.95}100%{opacity:0}}
.count{position:absolute;inset:0;display:grid;place-items:center;font-size:120px;font-weight:600;pointer-events:none;opacity:0}
.count.pop{animation:pop 1s ease-out}
@keyframes pop{0%{opacity:0;transform:scale(1.5)}20%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.8)}}
.tag{position:absolute;left:50%;bottom:14px;transform:translate(-50%,10px);padding:7px 14px;border-radius:99px;background:#000a;backdrop-filter:blur(10px);font-size:13px;font-weight:500;opacity:0;transition:.3s;pointer-events:none;white-space:nowrap}
.tag.show{opacity:1;transform:translate(-50%,0)}
.dock{padding:10px 0 14px}
.tabs{display:flex;justify-content:center;gap:4px;margin-bottom:10px}
.tab{padding:6px 16px;border-radius:99px;font-size:13px;font-weight:500;color:var(--mut);transition:.25s}
.tab.on{background:#fff;color:#000}
.row{display:flex;gap:12px;overflow-x:auto;padding:2px 18px 10px;scrollbar-width:none;scroll-snap-type:x proximity}
.row::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--mut);scroll-snap-align:center;transition:color .25s,transform .25s}
.chip:active{transform:scale(.92)}
.sw{width:54px;height:54px;border-radius:50%;border:2px solid #333;background:linear-gradient(135deg,#f0b9a2,#6d93b8 55%,#f7e8c9);transition:border-color .25s,transform .25s}
.ow{width:54px;height:54px;border-radius:16px;border:2px solid #333;display:grid;place-items:center;font-size:18px;transition:.25s;background:#0d0d0d}
.chip.on{color:#fff}
.chip.on .sw,.chip.on .ow{border-color:#fff;transform:scale(1.08)}
.bar{display:flex;align-items:center;justify-content:space-around;padding:6px 24px 0}
.thumb{width:54px;height:54px;border-radius:16px;border:1px solid #333;background:#0d0d0d center/cover;overflow:hidden;transition:transform .2s}
.thumb:active{transform:scale(.9)}
.thumb.bump{animation:bump .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes bump{0%{transform:scale(.5)}100%{transform:scale(1)}}
.shut{width:80px;height:80px;border-radius:50%;border:3px solid #fff;display:grid;place-items:center;transition:transform .15s}
.shut i{display:block;width:62px;height:62px;border-radius:50%;background:#fff;transition:transform .18s cubic-bezier(.3,1.5,.5,1)}
.shut:active i{transform:scale(.82)}
.shut:active{transform:scale(.96)}
.flip.spin svg{animation:sp .5s cubic-bezier(.3,.8,.3,1)}
@keyframes sp{to{transform:rotate(360deg)}}
.sheet{position:fixed;inset:0;display:flex;align-items:flex-end;background:#000a;backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .3s;z-index:5}
.sheet.open{opacity:1;pointer-events:auto}
.panel{width:100%;max-height:82%;overflow:auto;background:var(--card);border-top:1px solid var(--line);border-radius:28px 28px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .45s cubic-bezier(.2,.9,.2,1)}
.sheet.open .panel{transform:none}
.grab{width:40px;height:4px;border-radius:9px;background:#333;margin:0 auto 14px}
h2{font-size:20px;font-weight:700;margin-bottom:8px;letter-spacing:-.01em}
.set{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);font-size:15px;gap:12px}
.set small{display:block;color:var(--mut);font-size:12px;margin-top:2px}
.tg{width:50px;height:30px;border-radius:99px;background:#2a2a2a;position:relative;transition:background .3s;flex:none}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#777;transition:.3s cubic-bezier(.3,1.4,.5,1)}
.tg.on{background:#fff}.tg.on::after{left:23px;background:#000}
.seg{display:flex;background:#1a1a1a;border-radius:99px;padding:3px;flex:none}
.seg button{padding:6px 12px;border-radius:99px;font-size:13px;color:var(--mut);transition:.25s}
.seg button.on{background:#fff;color:#000}
.pg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.pg img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:12px;background:#1a1a1a;transition:transform .2s}
.pg img:active{transform:scale(.95)}
.empty{color:var(--mut);padding:30px 0;text-align:center;font-size:14px}
.big{position:fixed;inset:0;background:#000;z-index:6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;opacity:0;pointer-events:none;transition:opacity .3s;padding:20px}
.big.open{opacity:1;pointer-events:auto}
.big img{max-width:100%;max-height:72%;border-radius:18px;-webkit-user-select:auto;user-select:auto;-webkit-touch-callout:default}
.btns{display:flex;gap:10px}
.pill{padding:11px 22px;border-radius:99px;border:1px solid #444;font-weight:500;font-size:14px}
.pill.w{background:#fff;color:#000;border-color:#fff}
.hint{color:var(--mut);font-size:12px}
.start{position:fixed;inset:0;z-index:9;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:30px;transition:opacity .5s,visibility .5s}
.start.gone{opacity:0;visibility:hidden}
.start h1{font-size:44px;letter-spacing:-.04em;font-weight:700}
.start p{color:var(--mut);max-width:280px;line-height:1.5;font-size:15px}
.err{color:#fff;font-size:13px;max-width:290px;min-height:18px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="start" id="start">
  <h1>Lumo</h1>
  <p>Shoot with the look already on. Pick a filter and an overlay, then tap the shutter.</p>
  <button class="pill w" id="go">Open camera</button>
  <button class="pill" id="demoBtn">Preview without camera</button>
  <div class="err" id="err"></div>
</div>

<div class="top">
  <div class="brand">Lumo</div>
  <button class="ib" id="gear" aria-label="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3h0a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5h0a1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8v0a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
</div>

<div class="stage">
  <div class="view" id="view">
    <video id="vid" playsinline muted autoplay></video>
    <canvas id="demo" width="900" height="1200" hidden></canvas>
    <canvas id="ov"></canvas>
    <div class="grid" id="grid"></div>
    <div class="flash" id="flash"></div>
    <div class="count" id="count"></div>
    <div class="tag" id="tag"></div>
  </div>
</div>

<div class="dock">
  <div class="tabs">
    <button class="tab on" data-t="f">Filters</button>
    <button class="tab" data-t="o">Overlays</button>
  </div>
  <div class="row" id="row"></div>
  <div class="bar">
    <button class="thumb" id="thumb" aria-label="Gallery"></button>
    <button class="shut" id="shut" aria-label="Take photo"><i></i></button>
    <button class="ib flip" id="flip" aria-label="Switch camera"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 15-6.7L21 8M21 3v5h-5M21 12a9 9 0 0 1-15 6.7L3 16M3 21v-5h5"/></svg></button>
  </div>
</div>

<div class="sheet" id="sset"><div class="panel">
  <div class="grab"></div><h2>Settings</h2>
  <div class="set"><div>Mirror photos<small>Save selfies flipped like the preview</small></div><div class="tg" data-k="mirror"></div></div>
  <div class="set"><div>Shutter sound</div><div class="tg" data-k="sound"></div></div>
  <div class="set"><div>Grid lines</div><div class="tg" data-k="grid"></div></div>
  <div class="set"><div>Timer</div><div class="seg" data-k="timer"><button data-v="0">Off</button><button data-v="3">3s</button><button data-v="10">10s</button></div></div>
  <div class="set"><div>Quality</div><div class="seg" data-k="q"><button data-v="720">Std</button><button data-v="1080">High</button><button data-v="1440">Max</button></div></div>
  <div class="set"><div>Ratio</div><div class="seg" data-k="ratio"><button data-v="0.75">3:4</button><button data-v="1">1:1</button><button data-v="0.5625">9:16</button></div></div>
</div></div>

<div class="sheet" id="sgal"><div class="panel">
  <div class="grab"></div><h2>Photos</h2>
  <div class="pg" id="pg"></div>
</div></div>

<div class="big" id="big">
  <img id="bigimg" alt="Captured photo">
  <div class="hint">Long-press the photo to save it to your gallery</div>
  <div class="btns"><button class="pill w" id="save">Save</button><button class="pill" id="close">Close</button></div>
</div>

<script>
const $=s=>document.querySelector(s);
const FILTERS=[["Original",""],["Milk","brightness(1.1) contrast(.9) saturate(.8) sepia(.1)"],["Honey","sepia(.4) saturate(1.4) brightness(1.05) hue-rotate(-10deg)"],["Peach","sepia(.25) saturate(1.2) hue-rotate(-15deg) brightness(1.08)"],["Dusk","contrast(1.1) saturate(1.3) hue-rotate(-20deg) sepia(.2)"],["Fade","contrast(.85) brightness(1.1) saturate(.7)"],["Frost","hue-rotate(15deg) saturate(.8) brightness(1.1) contrast(.95)"],["Cinema","contrast(1.25) saturate(.9) sepia(.15) brightness(.95)"],["Vivid","saturate(1.6) contrast(1.1)"],["Noir","grayscale(1) contrast(1.3)"]];
const OVERLAYS=[["None","∅"],["Grain","▒"],["Leak","◐"],["Sunburst","✦"],["Date","’26"],["Polaroid","▭"],["Film","▤"],["Bokeh","◌"],["Vignette","◍"]];
const S={f:0,o:0,tab:"f",facing:"user",mirror:true,sound:true,grid:false,timer:0,q:1080,ratio:.75};
const photos=[];let stream=null,busy=false,ac=null,cur=null;
const vid=$("#vid"),ov=$("#ov"),view=$("#view");

/* sound */
function ctx(){ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==="suspended")ac.resume();return ac}
function tick(f=900){if(!S.sound)return;try{const a=ctx(),o=a.createOscillator(),g=a.createGain();o.type="sine";o.frequency.value=f;g.gain.setValueAtTime(.04,a.currentTime);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+.06);o.connect(g).connect(a.destination);o.start();o.stop(a.currentTime+.07)}catch(e){}}
function shutter(){if(!S.sound)return;try{const a=ctx(),t=a.currentTime,n=a.createBuffer(1,a.sampleRate*.09,a.sampleRate),d=n.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,3);const s=a.createBufferSource();s.buffer=n;const b=a.createBiquadFilter();b.type="bandpass";b.frequency.value=2600;const g=a.createGain();g.gain.value=.5;s.connect(b).connect(g).connect(a.destination);s.start(t);const o=a.createOscillator(),h=a.createGain();o.frequency.setValueAtTime(170,t+.05);o.frequency.exponentialRampToValueAtTime(55,t+.15);h.gain.setValueAtTime(.0001,t);h.gain.setValueAtTime(.35,t+.05);h.gain.exponentialRampToValueAtTime(.0001,t+.17);o.connect(h).connect(a.destination);o.start(t+.05);o.stop(t+.2)}catch(e){}}
const buzz=n=>{try{navigator.vibrate&&navigator.vibrate(n)}catch(e){}};

/* noise tile */
const noise=document.createElement("canvas");noise.width=noise.height=256;
(()=>{const c=noise.getContext("2d"),im=c.createImageData(256,256);for(let i=0;i<im.data.length;i+=4){const v=Math.random()*255;im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=255}c.putImageData(im,0,0)})();

/* overlays: drawn identically for preview and saved photo */
function rnd(seed){let s=seed;return()=>(s=(s*16807)%2147483647)/2147483647}
function drawOv(c,w,h,k){
  c.save();
  if(k==="Grain"){c.globalAlpha=.16;c.globalCompositeOperation="overlay";c.fillStyle=c.createPattern(noise,"repeat");c.fillRect(0,0,w,h)}
  else if(k==="Leak"){c.globalCompositeOperation="screen";let g=c.createRadialGradient(w,h*.15,0,w,h*.15,w*.9);g.addColorStop(0,"rgba(255,120,60,.75)");g.addColorStop(.5,"rgba(255,60,120,.28)");g.addColorStop(1,"rgba(255,60,120,0)");c.fillStyle=g;c.fillRect(0,0,w,h);g=c.createLinearGradient(0,h,w*.5,h*.6);g.addColorStop(0,"rgba(255,200,80,.4)");g.addColorStop(1,"rgba(255,200,80,0)");c.fillStyle=g;c.fillRect(0,0,w,h)}
  else if(k==="Sunburst"){c.globalCompositeOperation="screen";const x=w*.15,y=h*.12;let g=c.createRadialGradient(x,y,0,x,y,w*.8);g.addColorStop(0,"rgba(255,248,220,.95)");g.addColorStop(.12,"rgba(255,220,150,.5)");g.addColorStop(1,"rgba(255,200,120,0)");c.fillStyle=g;c.fillRect(0,0,w,h);c.translate(x,y);c.rotate(.5);for(let i=0;i<6;i++){c.rotate(Math.PI/3);g=c.createLinearGradient(0,0,w,0);g.addColorStop(0,"rgba(255,235,190,.25)");g.addColorStop(1,"rgba(255,235,190,0)");c.fillStyle=g;c.fillRect(0,-w*.012,w*1.2,w*.024)}}
  else if(k==="Date"){const d=new Date(),t="’"+String(d.getFullYear()).slice(2)+"  "+String(d.getMonth()+1).padStart(2,"0")+"  "+String(d.getDate()).padStart(2,"0");c.font="600 "+w*.045+"px 'Courier New',monospace";c.textAlign="right";c.fillStyle="#ff9a2e";c.shadowColor="rgba(255,120,0,.8)";c.shadowBlur=w*.012;c.fillText(t,w*.94,h*.95)}
  else if(k==="Polaroid"){c.fillStyle="#f6f3ec";const m=w*.05;c.fillRect(0,0,w,m);c.fillRect(0,0,m,h);c.fillRect(w-m,0,m,h);c.fillRect(0,h-h*.15,w,h*.15)}
  else if(k==="Film"){const b=h*.075;c.fillStyle="#050505";c.fillRect(0,0,w,b);c.fillRect(0,h-b,w,b);c.fillStyle="#d8d4c8";const n=14,gap=w/n,hw=gap*.45,hh=b*.42;for(let i=0;i<n;i++){const x=gap*i+gap*.27;c.beginPath();c.roundRect(x,b*.29,hw,hh,hh*.25);c.roundRect(x,h-b+b*.29,hw,hh,hh*.25);c.fill()}}
  else if(k==="Bokeh"){c.globalCompositeOperation="screen";const r=rnd(7);for(let i=0;i<16;i++){const x=r()*w,y=r()*h,s=w*(.03+r()*.07),g=c.createRadialGradient(x,y,s*.6,x,y,s);const col=["255,230,180","255,170,200","190,220,255"][i%3];g.addColorStop(0,"rgba("+col+",.1)");g.addColorStop(.85,"rgba("+col+",.28)");g.addColorStop(1,"rgba("+col+",0)");c.fillStyle=g;c.beginPath();c.arc(x,y,s,0,7);c.fill()}}
  else if(k==="Vignette"){const g=c.createRadialGradient(w/2,h/2,Math.min(w,h)*.3,w/2,h/2,Math.max(w,h)*.75);g.addColorStop(0,"rgba(0,0,0,0)");g.addColorStop(1,"rgba(0,0,0,.65)");c.fillStyle=g;c.fillRect(0,0,w,h)}
  c.restore();
}
function paintPreview(){
  const r=view.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);
  ov.width=Math.round(r.width*dpr);ov.height=Math.round(r.height*dpr);
  const c=ov.getContext("2d");c.clearRect(0,0,ov.width,ov.height);drawOv(c,ov.width,ov.height,OVERLAYS[S.o][0]);
}

/* camera */
async function start(){
  if(stream)stream.getTracks().forEach(t=>t.stop());
  const hi=S.q>=1440;
  stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:S.facing},width:{ideal:hi?3840:1920},height:{ideal:hi?2160:1080}}});
  vid.srcObject=stream;await vid.play().catch(()=>{});
  vid.classList.toggle("mir",S.facing==="user");
}
$("#go").onclick=async()=>{
  try{ctx();if(!navigator.mediaDevices)throw 0;await start();$("#start").classList.add("gone");tick(1200)}
  catch(e){$("#err").textContent="Camera isn’t available here. Tap Preview without camera to try the app."}
};
$("#flip").onclick=async e=>{
  tick(700);buzz(8);const b=e.currentTarget;b.classList.remove("spin");void b.offsetWidth;b.classList.add("spin");
  if(DEMO){scene^=1;drawScene();return}vid.style.opacity=.2;S.facing=S.facing==="user"?"environment":"user";
  try{await start()}catch(x){toast("Could not switch camera")}
  vid.style.opacity=1;
};

/* UI */
function toast(t){const e=$("#tag");e.textContent=t;e.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("show"),1200)}
function applyFilter(){const v=FILTERS[S.f][1]||"none";vid.style.filter=v;$("#demo").style.filter=v}
function renderRow(){
  const row=$("#row");row.innerHTML="";
  if(S.tab==="f")FILTERS.forEach((f,i)=>{const b=document.createElement("button");b.className="chip"+(i===S.f?" on":"");b.innerHTML='<div class="sw" style="filter:'+(f[1]||"none")+'"></div>'+f[0];b.onclick=()=>{S.f=i;applyFilter();tick(800+i*40);buzz(6);toast(f[0]);renderRow()};row.appendChild(b)});
  else OVERLAYS.forEach((o,i)=>{const b=document.createElement("button");b.className="chip"+(i===S.o?" on":"");b.innerHTML='<div class="ow">'+o[1]+'</div>'+o[0];b.onclick=()=>{S.o=i;paintPreview();tick(800+i*40);buzz(6);toast(o[0]);renderRow()};row.appendChild(b)});
  const on=row.querySelector(".on");if(on)on.scrollIntoView({inline:"center",block:"nearest",behavior:"smooth"});
}
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{S.tab=t.dataset.t;document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x===t));tick(600);renderRow()});

function sync(){
  document.querySelectorAll(".tg").forEach(t=>t.classList.toggle("on",!!S[t.dataset.k]));
  document.querySelectorAll(".seg").forEach(s=>s.querySelectorAll("button").forEach(b=>b.classList.toggle("on",+b.dataset.v===+S[s.dataset.k])));
  $("#grid").classList.toggle("on",S.grid);
  view.style.aspectRatio=S.ratio;
}
document.querySelectorAll(".tg").forEach(t=>t.onclick=()=>{S[t.dataset.k]=!S[t.dataset.k];tick(1000);sync()});
document.querySelectorAll(".seg button").forEach(b=>b.onclick=async()=>{const k=b.parentNode.dataset.k;S[k]=+b.dataset.v;tick(1000);sync();if(k==="ratio")setTimeout(paintPreview,480);if(k==="q"&&stream){try{await start()}catch(e){}}});
const open=(id,v)=>{$(id).classList.toggle("open",v);tick(v?900:600)};
$("#gear").onclick=()=>open("#sset",true);
$("#sset").onclick=e=>{if(e.target.id==="sset")open("#sset",false)};
$("#sgal").onclick=e=>{if(e.target.id==="sgal")open("#sgal",false)};
$("#thumb").onclick=()=>{renderGal();open("#sgal",true)};
function renderGal(){const g=$("#pg");g.innerHTML="";if(!photos.length){g.outerHTML='<div class="pg" id="pg"><div class="empty" style="grid-column:1/-1">No photos yet. Tap the shutter.</div></div>';return}photos.slice().reverse().forEach(p=>{const i=document.createElement("img");i.src=p.url;i.onclick=()=>{cur=p;$("#bigimg").src=p.url;open("#sgal",false);$("#big").classList.add("open")};g.appendChild(i)})}
$("#close").onclick=()=>{$("#big").classList.remove("open");tick(600)};
$("#save").onclick=async()=>{
  try{const f=new File([cur.blob],cur.name,{type:"image/jpeg"});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return}}catch(e){if(e&&e.name==="AbortError")return}
  const a=document.createElement("a");a.href=cur.url;a.download=cur.name;document.body.appendChild(a);a.click();a.remove();toast("Long-press the photo to save")
};

/* capture */
function capture(){
  const src=DEMO?$("#demo"):vid;const vw=DEMO?src.width:vid.videoWidth,vh=DEMO?src.height:vid.videoHeight;if(!vw)return;
  const W=Math.round(S.q*(S.ratio>1?1:S.ratio)),H=Math.round(W/S.ratio);
  const cv=document.createElement("canvas");cv.width=W;cv.height=H;const c=cv.getContext("2d");
  const sr=vw/vh;let sw=vw,sh=vh,sx=0,sy=0;
  if(sr>S.ratio){sw=vh*S.ratio;sx=(vw-sw)/2}else{sh=vw/S.ratio;sy=(vh-sh)/2}
  c.save();
  if("filter" in c)c.filter=FILTERS[S.f][1]||"none";
  const flipIt=S.facing==="user"&&S.mirror&&!DEMO;
  if(flipIt){c.translate(W,0);c.scale(-1,1)}
  /* video is previewed mirrored for front camera; raw frame is un-mirrored, so flip when saving mirrored */
  c.drawImage(src,sx,sy,sw,sh,0,0,W,H);
  c.restore();
  drawOv(c,W,H,OVERLAYS[S.o][0]);
  cv.toBlob(b=>{
    const url=URL.createObjectURL(b);const p={blob:b,url,name:"lumo-"+Date.now()+".jpg"};photos.push(p);
    const t=$("#thumb");t.style.backgroundImage="url("+url+")";t.classList.remove("bump");void t.offsetWidth;t.classList.add("bump");
  },"image/jpeg",.93);
}
$("#shut").onclick=async()=>{
  if(busy||(!DEMO&&!vid.videoWidth))return;busy=true;buzz(12);
  if(S.timer){const n=$("#count");for(let i=S.timer;i>0;i--){n.textContent=i;n.classList.remove("pop");void n.offsetWidth;n.classList.add("pop");tick(i===1?1400:900);await new Promise(r=>setTimeout(r,1000))}}
  shutter();const f=$("#flash");f.classList.remove("go");void f.offsetWidth;f.classList.add("go");
  capture();busy=false;
};

/* demo scene (no camera needed) */
let DEMO=false,scene=0;
function drawScene(){
  const cv=$("#demo"),c=cv.getContext("2d"),W=900,H=1200;
  const P=scene?["#16324a","#5b6fa8","#e8a0b4","#f6d7a7","#1e3a4f","#2b5560","#3f7b78"]:["#f7b79b","#e9a3b9","#b9a2dc","#fff1c9","#8f6aa8","#6f5896","#4a3f7a"];
  let g=c.createLinearGradient(0,0,0,H*.7);g.addColorStop(0,P[1]);g.addColorStop(.55,P[2]);g.addColorStop(1,P[0]);c.fillStyle=g;c.fillRect(0,0,W,H);
  g=c.createRadialGradient(W*.62,H*.42,10,W*.62,H*.42,300);g.addColorStop(0,P[3]);g.addColorStop(.35,P[3]+"cc");g.addColorStop(1,P[3]+"00");c.fillStyle=g;c.fillRect(0,0,W,H);
  c.fillStyle=P[3];c.beginPath();c.arc(W*.62,H*.42,90,0,7);c.fill();
  c.fillStyle="#ffffff55";[[180,260,120],[640,200,90],[430,330,70]].forEach(([x,y,r])=>{c.beginPath();c.ellipse(x,y,r*1.8,r*.4,0,0,7);c.fill()});
  [[P[4],.62,70],[P[5],.72,110],[P[6],.84,80]].forEach(([col,y,a],i)=>{c.fillStyle=col;c.beginPath();c.moveTo(0,H);c.lineTo(0,H*y);for(let x=0;x<=W;x+=30)c.lineTo(x,H*y+Math.sin(x/140+i*2)*a);c.lineTo(W,H);c.fill()});
  c.fillStyle="#2a1f3acc";c.fillRect(W*.2,H*.74,14,120);c.beginPath();c.arc(W*.2+7,H*.74,54,0,7);c.fill();
  const cols=["#fff","#ffd1dc","#ffe08a","#c7e2ff"];for(let i=0;i<60;i++){c.fillStyle=cols[i%4];c.beginPath();c.arc((i*137)%W,H*.9+((i*53)%160),5+(i%4)*2,0,7);c.fill()}
}
$("#demoBtn").onclick=()=>{DEMO=true;$("#demo").hidden=false;vid.hidden=true;drawScene();$("#start").classList.add("gone");tick(1200);applyFilter();setTimeout(()=>toast("Preview mode · no camera needed"),500)};

/* init */
addEventListener("resize",paintPreview);
new ResizeObserver(paintPreview).observe(view);
sync();renderRow();applyFilter();paintPreview();
</script>
</body>
